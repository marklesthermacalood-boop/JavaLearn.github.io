<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - JavaLearn Hub</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --bg: #100817;
      --accent: #ff8a00;
      --accent-dark: #d97706;
      --purple: #8b5cf6;
      --text: #f8f7ff;
      --muted: #d8cbff;
    }

    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 36px;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 32px;
      margin-bottom: 32px;
      box-shadow: 0 24px 72px rgba(0, 0, 0, 0.2);
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .profile-info h1 {
      font-size: 2.2rem;
      color: #fff;
      margin-bottom: 8px;
    }

    .profile-info p {
      color: var(--muted);
      font-size: 1rem;
    }

    .logout-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #111;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .logout-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 36px rgba(255, 138, 0, 0.2);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-box {
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
    }

    .stat-box h3 {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .stat-box .value {
      font-size: 2.4rem;
      color: #fff;
      font-weight: 800;
    }

    .scores-section {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 24px 72px rgba(0, 0, 0, 0.2);
    }

    .scores-section h2 {
      color: #fff;
      margin-bottom: 24px;
      font-size: 1.8rem;
    }

    .score-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-info h4 {
      color: #fff;
      margin-bottom: 6px;
    }

    .score-info p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .score-value {
      font-size: 1.8rem;
      color: var(--accent);
      font-weight: 800;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      .dashboard-container {
        padding: 24px 18px;
      }

      .profile-header {
        flex-direction: column;
        gap: 20px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-auth.js"></script>
</head>

<body>

<header>
  <div class="logo">☕ JavaLearn Hub</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="lessons.html">Lessons</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="login.html" onclick="logout(); return false;">Logout</a>
  </nav>
</header>

<section class="lesson-hero">
  <div class="hero-content">
    <div class="icon">📊</div>
    <div>
      <h1>Your Dashboard</h1>
      <p class="breadcrumb">Track your learning progress and scores</p>
    </div>
  </div>
</section>

<div class="dashboard-container">

  <div class="profile-card">
    <div class="profile-header">
      <div class="profile-info">
        <h1 id="username">Loading...</h1>
        <p id="userEmail">Loading...</p>
        <p style="margin-top: 8px; font-size: 0.9rem;" id="userRole">Role: Student</p>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-box">
        <h3>Lessons Completed</h3>
        <div class="value" id="completedLessons">0</div>
      </div>
      <div class="stat-box">
        <h3>Total Score</h3>
        <div class="value" id="totalScore">0</div>
      </div>
      <div class="stat-box">
        <h3>Average Score</h3>
        <div class="value" id="avgScore">0%</div>
      </div>
    </div>
  </div>

  <div class="scores-section">
    <h2>🏆 Recent Scores</h2>
    <div id="scoresContainer">
      <div class="empty-state">Loading your scores...</div>
    </div>
  </div>

</div>

<footer style="margin-top: 60px;">
  � 2025 JavaLearn Hub. All rights reserved.
</footer>

<script>
// Check authentication and load dashboard
firebase.auth().onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  // Update profile info
  document.getElementById("username").textContent = user.displayName || user.email;
  document.getElementById("userEmail").textContent = user.email;

  // Load user role from Firestore
  const userDoc = await db.collection("users").doc(user.uid).get();
  if (userDoc.exists) {
    const role = userDoc.data().role || "Student";
    document.getElementById("userRole").textContent = "Role: " + role.charAt(0).toUpperCase() + role.slice(1);
  }

  // Load user scores
  await loadUserScores(user.uid);
});

async function loadUserScores(userId) {
  try {
    console.log("Loading scores for user:", userId);
    const result = await getUserScores();
    
    console.log("Score result:", result);
    
    if (!result.success || result.scores.length === 0) {
      console.warn("No scores found for user");
      document.getElementById("scoresContainer").innerHTML = 
        '<div class="empty-state">No scores yet. Start with a quiz to get started!</div>';
      updateStats([], userId);
      return;
    }

    const scores = result.scores;
    console.log("Displaying scores:", scores.length);

    // Update stats
    updateStats(scores, userId);

    // Display scores
    const scoresHtml = scores.slice(0, 10).map(score => {
      const type = score.lessonId ? `📘 Lesson ${score.lessonId}` : `⚔️ Challenge ${score.challengeId}`;
      
      // Handle both server timestamp object and Date
      let dateStr = "N/A";
      if (score.timestamp) {
        if (score.timestamp.seconds) {
          dateStr = new Date(score.timestamp.seconds * 1000).toLocaleDateString();
        } else if (score.timestamp instanceof Date) {
          dateStr = score.timestamp.toLocaleDateString();
        }
      }
      
      return `
        <div class="score-item">
          <div class="score-info">
            <h4>${type}</h4>
            <p>Completed: ${dateStr}</p>
          </div>
          <div class="score-value">${score.score}%</div>
        </div>
      `;
    }).join("");

    document.getElementById("scoresContainer").innerHTML = scoresHtml;
  } catch (err) {
    console.error("Error loading scores:", err);
    document.getElementById("scoresContainer").innerHTML = 
      '<div class="empty-state">Error loading scores. Please refresh the page.</div>';
  }
}

function updateStats(scores, userId) {
  if (scores.length === 0) {
    document.getElementById("completedLessons").textContent = "0";
    document.getElementById("totalScore").textContent = "0";
    document.getElementById("avgScore").textContent = "0%";
    return;
  }

  const lessons = new Set(scores.map(s => s.lessonId).filter(l => l !== null));
  const avgScore = Math.round(scores.reduce((sum, s) => sum + s.score, 0) / scores.length);
  const totalScore = scores.reduce((sum, s) => sum + s.score, 0);

  document.getElementById("completedLessons").textContent = lessons.size;
  document.getElementById("totalScore").textContent = totalScore;
  document.getElementById("avgScore").textContent = avgScore + "%";
}

// Logout function
async function logout() {
  try {
    await firebase.auth().signOut();
    window.location.href = "login.html";
  } catch (err) {
    console.error("Logout error:", err);
  }
}
</script>

</body>
</html>
