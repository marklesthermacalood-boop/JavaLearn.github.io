<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Quiz</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top left, rgba(255, 138, 0, 0.18), transparent 20%),
    radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.22), transparent 18%),
    linear-gradient(180deg, #100817 0%, #170c29 55%, #100817 100%);
  color: #f8f7ff;
}

header {
  background: rgba(16, 8, 23, 0.88);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 36px;
  position: sticky;
  top: 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(18px);
}

header .logo {
  font-size: 1.25rem;
  font-weight: 800;
}

header nav {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

header nav a {
  color: #d8cbff;
  text-decoration: none;
  transition: color 0.25s ease;
}

header nav a:hover {
  color: #fff;
}

.hero {
  min-height: 180px;
  display: flex;
  align-items: center;
  padding: 0 40px;
  background: linear-gradient(135deg, rgba(255, 138, 0, 0.92), rgba(139, 92, 246, 0.92));
  color: white;
}

.hero h1 {
  font-size: clamp(2.6rem, 4vw, 3.8rem);
}

.container {
  max-width: 920px;
  margin: auto;
  padding: 40px 20px;
}

.score-box {
  background: rgba(255, 255, 255, 0.08);
  padding: 30px;
  border-radius: 24px;
  text-align: center;
  margin-bottom: 30px;
  box-shadow: 0 28px 60px rgba(0, 0, 0, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.12);
}

#score {
  font-size: 3rem;
  color: #fff;
}

.card {
  background: rgba(255, 255, 255, 0.08);
  padding: 24px;
  border-radius: 24px;
  margin-bottom: 20px;
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.12);
}

label {
  display: block;
  margin: 10px 0;
  cursor: pointer;
  color: #cec6ff;
}

button {
  padding: 14px 22px;
  background: linear-gradient(135deg, #ff8a00, #d97706);
  color: #111;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  margin-top: 20px;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 18px 36px rgba(255, 138, 0, 0.2);
}
</style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-auth.js"></script>
</head>

<body>

<header>
  <div class="logo">☕ JavaLearn Hub</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="lessons.html">Lessons</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>
</header>

<section class="hero">
  <h1>Java Quiz</h1>
</section>

<div class="container">

  <div class="score-box">
    <h2>Your Score</h2>
    <h1 id="score">0 / 20</h1>
    <p id="difficultyLabel" style="margin-top: 12px; color: #d8cbff;">Difficulty: Easy</p>
  </div>

  <div class="card" style="display: flex; flex-wrap: wrap; align-items: center; gap: 18px; justify-content: space-between;">
    <div>
      <h2 style="margin-bottom: 12px; color: #fff;">Choose Quiz Difficulty</h2>
      <p style="color: #d8cbff; max-width: 680px; line-height: 1.6;">Select easy, medium, or hard and take a full 20-question Java quiz. Each difficulty has its own question bank and score is saved to your progress dashboard.</p>
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      <select id="difficultySelect" style="padding: 14px 18px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: #fff; min-width: 160px;">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="loadQuizBtn" type="button" style="padding: 14px 18px; border-radius: 18px;">Load Quiz</button>
    </div>
  </div>

  <form id="quizForm"></form>

  <button id="submitBtn">Submit Quiz</button>
</div>

<script>
const quizBank = {
  easy: [
    { question: "Java is a?", options: { a: "Operating System", b: "Programming Language", c: "Hardware" }, answer: "b" },
    { question: "Which symbol ends a statement?", options: { a: ":", b: ";", c: "." }, answer: "b" },
    { question: "Keyword to create a class?", options: { a: "class", b: "define", c: "function" }, answer: "a" },
    { question: "What does JVM stand for?", options: { a: "Java Virtual Machine", b: "Java Visual Model", c: "Just Virtual Memory" }, answer: "a" },
    { question: "Which type holds whole numbers?", options: { a: "String", b: "int", c: "boolean" }, answer: "b" },
    { question: "Which keyword prints text to the console?", options: { a: "print", b: "System.out.println", c: "console.log" }, answer: "b" },
    { question: "Java source files end with?", options: { a: ".java", b: ".js", c: ".class" }, answer: "a" },
    { question: "The main method begins with?", options: { a: "public static void main", b: "main(String[] args)", c: "void start()" }, answer: "a" },
    { question: "Which loop will execute at least once?", options: { a: "while", b: "for", c: "do-while" }, answer: "c" },
    { question: "Which keyword declares a constant?", options: { a: "const", b: "final", c: "static" }, answer: "b" },
    { question: "What is a boolean?", options: { a: "true or false", b: "a letter", c: "a number" }, answer: "a" },
    { question: "What does API stand for?", options: { a: "Application Programming Interface", b: "Automatic Program Input", c: "Active Process Index" }, answer: "a" },
    { question: "Which collection stores key/value pairs?", options: { a: "Array", b: "Map", c: "List" }, answer: "b" },
    { question: "Which keyword is used to inherit a class?", options: { a: "extends", b: "implements", c: "imports" }, answer: "a" },
    { question: "Which type stores text?", options: { a: "float", b: "String", c: "char" }, answer: "b" },
    { question: "What is the default value of a boolean?", options: { a: "true", b: "false", c: "null" }, answer: "b" },
    { question: "Which statement stops a loop?", options: { a: "continue", b: "break", c: "return" }, answer: "b" },
    { question: "Which access modifier is most permissive?", options: { a: "private", b: "protected", c: "public" }, answer: "c" },
    { question: "What is a constructor used for?", options: { a: "delete objects", b: "build objects", c: "run loops" }, answer: "b" },
    { question: "Which keyword is used for equality check of objects?", options: { a: "==", b: "equals", c: "equalsIgnoreCase" }, answer: "b" }
  ],
  medium: [
    { question: "Which statement is true about interfaces?", options: { a: "Interfaces can contain method bodies only", b: "Interfaces can contain abstract methods", c: "Interfaces can be instantiated" }, answer: "b" },
    { question: "Which collection maintains insertion order?", options: { a: "HashSet", b: "LinkedHashSet", c: "TreeSet" }, answer: "b" },
    { question: "What does JVM do with bytecode?", options: { a: "Compiles it to C++", b: "Interprets or JITs it", c: "Deletes it" }, answer: "b" },
    { question: "What is method overloading?", options: { a: "Same method name, different parameters", b: "Same parameters, different names", c: "Using methods inside loops" }, answer: "a" },
    { question: "Which keyword declares a checked exception?", options: { a: "throw", b: "throws", c: "try" }, answer: "b" },
    { question: "What is polymorphism?", options: { a: "Multiple methods with same name", b: "Objects behaving differently based on type", c: "A kind of variable" }, answer: "b" },
    { question: "Which type is used for a sequence of characters?", options: { a: "int", b: "String", c: "double" }, answer: "b" },
    { question: "Which keyword makes a class unable to be subclassed?", options: { a: "final", b: "static", c: "abstract" }, answer: "a" },
    { question: "Which statement creates a new object?", options: { a: "Object obj;", b: "new Object()", c: "Object = new" }, answer: "b" },
    { question: "Which operator tests reference equality?", options: { a: "equals", b: "==", c: "instanceof" }, answer: "b" },
    { question: "How do you declare an array of integers?", options: { a: "int[] arr;", b: "array<int> arr;", c: "List<int> arr;" }, answer: "a" },
    { question: "Which loop is best when number of repetitions is known?", options: { a: "while", b: "for", c: "do-while" }, answer: "b" },
    { question: "What is a checked exception?", options: { a: "Handled at compile time", b: "Handled at runtime only", c: "Ignored by compiler" }, answer: "a" },
    { question: "Which modifier means method cannot be overridden?", options: { a: "static", b: "final", c: "private" }, answer: "b" },
    { question: "What does ‘static’ mean?", options: { a: "Belongs to the class", b: "Belongs to the object", c: "Runs only once" }, answer: "a" },
    { question: "Which method starts a thread?", options: { a: "run()", b: "start()", c: "execute()" }, answer: "b" },
    { question: "What is the size of a char?", options: { a: "8 bits", b: "16 bits", c: "32 bits" }, answer: "b" },
    { question: "Which structure is LIFO?", options: { a: "Queue", b: "Stack", c: "Map" }, answer: "b" },
    { question: "What does ‘final’ on a variable mean?", options: { a: "Value can change", b: "Value cannot change", c: "Value is hidden" }, answer: "b" },
    { question: "What is the result of 10 / 3 with integer division?", options: { a: "3", b: "3.33", c: "4" }, answer: "a" }
  ],
  hard: [
    { question: "Which is a functional interface?", options: { a: "Runnable", b: "ArrayList", c: "String" }, answer: "a" },
    { question: "What is the default value of a local variable?", options: { a: "null", b: "0", c: "No default value" }, answer: "c" },
    { question: "Which keyword creates an anonymous inner class?", options: { a: "new", b: "this", c: "super" }, answer: "a" },
    { question: "Which type can hold object references and primitives?", options: { a: "List", b: "Object", c: "String" }, answer: "b" },
    { question: "What does ‘volatile’ guarantee?", options: { a: "Thread-safe mutability", b: "Visibility across threads", c: "Automatic serialization" }, answer: "b" },
    { question: "Which statement is true about abstract classes?", options: { a: "They can be instantiated", b: "They may contain abstract methods", c: "They cannot have constructors" }, answer: "b" },
    { question: "What is autoboxing?", options: { a: "Converting primitives to wrapper classes", b: "Converting classes to primitives", c: "Automatic garbage collection" }, answer: "a" },
    { question: "Which collection is sorted by natural order?", options: { a: "HashMap", b: "TreeMap", c: "LinkedList" }, answer: "b" },
    { question: "What does ‘super’ refer to?", options: { a: "Current object", b: "Parent class", c: "Static member" }, answer: "b" },
    { question: "Which exception is unchecked?", options: { a: "IOException", b: "RuntimeException", c: "ClassNotFoundException" }, answer: "b" },
    { question: "What is covariance in Java?", options: { a: "Wider return types in overrides", b: "Changing method names", c: "Using varargs" }, answer: "a" },
    { question: "Which method compares strings ignoring case?", options: { a: "equals", b: "equalsIgnoreCase", c: "compareTo" }, answer: "b" },
    { question: "How does HashMap find a key?", options: { a: "By index", b: "By hashCode then equals", c: "By order" }, answer: "b" },
    { question: "What is the correct signature for main?", options: { a: "public static void main(String args)", b: "public static void main(String[] args)", c: "public void main(String[] args)" }, answer: "b" },
    { question: "Which keyword prevents method overriding?", options: { a: "private", b: "final", c: "static" }, answer: "b" },
    { question: "What does ‘transient’ do?", options: { a: "Prevents serialization", b: "Locks a variable", c: "Marks thread-local storage" }, answer: "a" },
    { question: "Which interface supports lambda expressions?", options: { a: "Serializable", b: "Runnable", c: "Collection" }, answer: "b" },
    { question: "What is a checked exception example?", options: { a: "NullPointerException", b: "FileNotFoundException", c: "IllegalArgumentException" }, answer: "b" },
    { question: "Which statement describes encapsulation?", options: { a: "Exposing all fields", b: "Hiding implementation details", c: "Using static methods" }, answer: "b" },
    { question: "What is the result of 5 % 2?", options: { a: "1", b: "2", c: "0" }, answer: "a" }
  ]
};

const difficultyLabels = {
  easy: "Easy",
  medium: "Medium",
  hard: "Hard"
};
let currentDifficulty = "easy";
let currentQuestions = [];

function createQuestionCard(item, index) {
  return `
    <div class="card">
      <h3>${index + 1}. ${item.question}</h3>
      ${Object.entries(item.options).map(([key, label]) => `
        <label><input type="radio" name="q${index + 1}" value="${key}"> ${label}</label>
      `).join("")}
    </div>
  `;
}

function renderQuiz(difficulty) {
  currentDifficulty = difficulty;
  document.getElementById("difficultySelect").value = difficulty;
  document.getElementById("difficultyLabel").textContent = `Difficulty: ${difficultyLabels[difficulty]}`;
  currentQuestions = quizBank[difficulty];
  document.getElementById("score").innerText = `0 / ${currentQuestions.length}`;

  const quizForm = document.getElementById("quizForm");
  quizForm.innerHTML = currentQuestions.map(createQuestionCard).join("");
  document.getElementById("submitBtn").disabled = false;
  document.getElementById("submitBtn").textContent = "Submit Quiz";
}

function getAnswerKey() {
  return currentQuestions.reduce((answers, item, idx) => {
    answers[`q${idx + 1}`] = item.answer;
    return answers;
  }, {});
}

function countAnswered(form) {
  return currentQuestions.reduce((count, _, idx) => {
    return count + (form.querySelector(`input[name="q${idx + 1}"]:checked`) ? 1 : 0);
  }, 0);
}

firebase.auth().onAuthStateChanged((user) => {
  if (!user) {
    alert("Please login to take the quiz!");
    window.location.href = "login.html";
  }
});

document.getElementById("difficultySelect").addEventListener("change", (event) => {
  renderQuiz(event.target.value);
});

document.getElementById("loadQuizBtn").addEventListener("click", () => {
  renderQuiz(document.getElementById("difficultySelect").value);
});

renderQuiz(currentDifficulty);

const submitBtn = document.getElementById("submitBtn");
submitBtn.addEventListener("click", async () => {
  if (!isUserAuthenticated()) {
    alert("Please login first!");
    window.location.href = "login.html";
    return;
  }

  const form = document.getElementById("quizForm");
  const answerKey = getAnswerKey();
  const total = currentQuestions.length;
  const answered = countAnswered(form);

  if (answered < total) {
    alert(`Please answer all ${total} questions before submitting.`);
    return;
  }

  let correct = 0;
  for (const question in answerKey) {
    const selected = form.querySelector(`input[name="${question}"]:checked`);
    if (selected && selected.value === answerKey[question]) {
      correct++;
    }
  }

  const percentage = Math.round((correct / total) * 100);
  document.getElementById("score").innerText = `${correct} / ${total}`;

  const result = await saveScore(null, null, percentage, correct, total, currentDifficulty, "quiz");
  if (result.success) {
    submitBtn.textContent = "✓ Score Saved!";
    submitBtn.disabled = true;
    alert(`Quiz Complete! ${difficultyLabels[currentDifficulty]} score: ${percentage}% (${correct}/${total})`);
    setTimeout(() => window.location.href = "dashboard.html", 2000);
  } else {
    alert("Error saving score: " + result.error);
  }
});
</script>

</body>
</html>
