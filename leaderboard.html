<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - JavaLearn Hub</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, rgba(255, 138, 0, 0.18), transparent 20%),
        radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.22), transparent 18%),
        linear-gradient(180deg, #100817 0%, #170c29 55%, #100817 100%);
      color: #f8f7ff;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(16, 8, 23, 0.88);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 36px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(18px);
      z-index: 1000;
    }

    header .logo {
      font-size: 1.25rem;
      font-weight: 800;
    }

    header nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    header nav a {
      color: #d8cbff;
      text-decoration: none;
      transition: color 0.25s ease;
    }

    header nav a:hover {
      color: #fff;
    }

    .hero {
      margin-top: 70px;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: linear-gradient(135deg, rgba(255, 138, 0, 0.92), rgba(139, 92, 246, 0.92));
      color: white;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .leaderboard-table {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.18);
    }

    .leaderboard-header {
      display: grid;
      grid-template-columns: 60px 1fr 120px 120px;
      gap: 20px;
      background: linear-gradient(135deg, rgba(255, 138, 0, 0.15), rgba(139, 92, 246, 0.15));
      padding: 20px 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 700;
      color: #ffd89b;
    }

    .leaderboard-row {
      display: grid;
      grid-template-columns: 60px 1fr 120px 120px;
      gap: 20px;
      padding: 20px 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      align-items: center;
      transition: background 0.2s ease;
    }

    .leaderboard-row:hover {
      background: rgba(255, 138, 0, 0.08);
    }

    .leaderboard-row:last-child {
      border-bottom: none;
    }

    .rank {
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      color: #ff8a00;
    }

    .rank.top-1 {
      color: #ffd700;
    }

    .rank.top-2 {
      color: #c0c0c0;
    }

    .rank.top-3 {
      color: #cd7f32;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8a00, #d97706);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #111;
      font-size: 1.1rem;
    }

    .user-name {
      font-weight: 600;
      color: #fff;
    }

    .user-email {
      font-size: 0.85rem;
      color: #d8cbff;
    }

    .score-display {
      text-align: center;
      font-weight: 700;
      font-size: 1.3rem;
      color: #a7f3d0;
    }

    .attempts {
      text-align: center;
      color: #d8cbff;
      font-size: 0.95rem;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #d8cbff;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #d8cbff;
    }

    .medal {
      display: inline-block;
      margin-right: 8px;
      font-size: 1.4rem;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 12px;
      }

      .leaderboard-header,
      .leaderboard-row {
        grid-template-columns: 50px 1fr 90px;
        gap: 12px;
      }

      .attempts {
        display: none;
      }

      .hero {
        margin-top: 120px;
        padding: 24px;
      }

      .container {
        padding: 24px 12px;
      }
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-auth.js"></script>
</head>

<body>

<header>
  <div class="logo">⚡ JavaLearn Hub</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="lessons.html">Lessons</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="login.html" onclick="handleLogout(); return false;">Logout</a>
  </nav>
</header>

<section class="hero">
  <div>
    <h1>🏆 Leaderboard</h1>
    <p>Top performers in the DSA Learning Hub</p>
  </div>
</section>

<div class="container">
  <div class="leaderboard-table">
    <div class="leaderboard-header">
      <div>Rank</div>
      <div>User</div>
      <div>Score</div>
      <div>Attempts</div>
    </div>
    <div id="leaderboardContainer">
      <div class="loading">Loading leaderboard...</div>
    </div>
  </div>
</div>

<footer style="margin-top: 60px; text-align: center; padding: 20px; color: #d8cbff;">
  © 2025 JavaLearn Hub. All rights reserved.
</footer>

<script>
// Load leaderboard on page load
document.addEventListener("DOMContentLoaded", async () => {
  await loadLeaderboard();
});

async function loadLeaderboard() {
  try {
    const result = await getLeaderboard(50);
    
    if (!result.success || result.leaderboard.length === 0) {
      document.getElementById("leaderboardContainer").innerHTML = 
        '<div class="empty-state">No scores yet. Be the first to take a challenge!</div>';
      return;
    }

    const leaderboard = result.leaderboard;
    
    // Group by user and get top score per user
    const userScores = {};
    leaderboard.forEach(score => {
      if (!userScores[score.userId]) {
        userScores[score.userId] = {
          username: score.username,
          email: score.userEmail,
          topScore: score.score,
          attempts: 1,
          totalScore: score.score
        };
      } else {
        userScores[score.userId].attempts++;
        userScores[score.userId].totalScore += score.score;
        userScores[score.userId].topScore = Math.max(userScores[score.userId].topScore, score.score);
      }
    });

    // Convert to array and sort by top score
    const sortedUsers = Object.values(userScores)
      .sort((a, b) => b.topScore - a.topScore)
      .slice(0, 50);

    // Generate HTML
    const leaderboardHtml = sortedUsers.map((user, index) => {
      const rank = index + 1;
      let medal = '';
      let rankClass = '';

      if (rank === 1) {
        medal = '🥇';
        rankClass = 'top-1';
      } else if (rank === 2) {
        medal = '🥈';
        rankClass = 'top-2';
      } else if (rank === 3) {
        medal = '🥉';
        rankClass = 'top-3';
      }

      const initials = (user.username || user.email).substring(0, 2).toUpperCase();

      return `
        <div class="leaderboard-row">
          <div class="rank ${rankClass}">
            ${medal ? '<span class="medal">' + medal + '</span>' : rank}
          </div>
          <div class="user-info">
            <div class="user-avatar">${initials}</div>
            <div>
              <div class="user-name">${user.username || user.email.split('@')[0]}</div>
              <div class="user-email">${user.email}</div>
            </div>
          </div>
          <div class="score-display">${user.topScore}%</div>
          <div class="attempts">${user.attempts} ${user.attempts === 1 ? 'attempt' : 'attempts'}</div>
        </div>
      `;
    }).join('');

    document.getElementById("leaderboardContainer").innerHTML = leaderboardHtml;
  } catch (err) {
    console.error("Error loading leaderboard:", err);
    document.getElementById("leaderboardContainer").innerHTML = 
      '<div class="empty-state">Error loading leaderboard. Please refresh the page.</div>';
  }
}
</script>

</body>
</html>
